<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <title>STACKR</title>
    <meta name="description" content="STACKR — inventory management for smoke shops, synced with Clover POS." />
    <meta property="og:title" content="STACKR" />
    <meta property="og:description" content="STACKR — inventory management for smoke shops, synced with Clover POS." />
    <meta name="apple-mobile-web-app-title" content="STACKR" />
    <meta name="application-name" content="STACKR" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('stackr-theme')
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
